services:
  partyqueue:
    build: .
    image: partyqueue:latest
    container_name: partyqueue
    # Host networking lets the container reach your Sonos system via SSDP
    # multicast discovery. This is required on most setups (incl. UnRaid).
    # With host networking the app is served on the host's PORT directly.
    network_mode: host
    # Loads all settings (Spotify keys, SONOS_ROOM, PORT, etc.) from the .env
    # file sitting next to this compose file.
    env_file:
      - .env
    # Persist the Spotify playlist login (refresh token) across rebuilds.
    # Alternatively, set SPOTIFY_REFRESH_TOKEN in .env and drop this volume.
    volumes:
      - ./data:/app/data
    # Guardrail: a hypothetical slow leak becomes a clean restart (via
    # restart: unless-stopped) instead of pressuring the whole host. The heap
    # cap keeps V8 comfortably under the container limit (headroom for
    # buffers, ffmpeg, and the TTS pipeline).
    mem_limit: 512m
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
    # Show the app's icon in the UnRaid Docker tab (served by the app itself).
    # Uses PUBLIC_BASE_URL from .env when set; otherwise localhost (host network).
    # autoheal=true lets the sibling autoheal service restart unhealthy containers
    # (HEALTHCHECK hits /api/ready — process + writable data/, not partyReady).
    labels:
      autoheal: "true"
      net.unraid.docker.icon: "${PUBLIC_BASE_URL:-http://127.0.0.1:8080}/icon.png"
    restart: unless-stopped

  # Restarts labeled containers when Docker HEALTHCHECK fails (willfarrell/autoheal).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: partyqueue-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"
      AUTOHEAL_START_PERIOD: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
