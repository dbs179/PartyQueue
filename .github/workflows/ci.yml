name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify share-safe package
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run package:share -- -OutDir "$env:RUNNER_TEMP\partyqueue-share"

      # @svrooij/sonos pulls an unfixed moderate fast-xml-parser advisory;
      # fail CI on high/critical only until upstream ships a clean release.
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build browser client bundle
        run: npm run build:client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:browser

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag partyqueue:ci .

      - name: Verify DJ runtime assets
        run: >-
          docker run --rm --entrypoint sh partyqueue:ci -c
          'command -v ffmpeg &&
          test -f /app/public/dj-silence-0.5s.mp3 &&
          test -f /app/public/dj-silence-5s.mp3'
