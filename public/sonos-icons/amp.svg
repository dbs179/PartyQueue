<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- Sonos Amp: low rectangular amp chassis -->
  <rect x="6" y="20" width="52" height="24" rx="3" stroke="#e8ecea" stroke-width="2.5"/>
  <!-- Front panel seam -->
  <path d="M6 28.5h52" stroke="#e8ecea" stroke-width="1.25" opacity="0.7"/>
  <!-- Status LED -->
  <circle cx="14" cy="36" r="2" fill="#e8ecea"/>
  <!-- Speaker terminals hint -->
  <circle cx="40" cy="36" r="2.2" stroke="#e8ecea" stroke-width="1.5"/>
  <circle cx="50" cy="36" r="2.2" stroke="#e8ecea" stroke-width="1.5"/>
  <!-- Vent lines -->
  <path d="M20 24.5h18M20 39.5h10" stroke="#e8ecea" stroke-width="1.25" stroke-linecap="round" opacity="0.65"/>
</svg>
